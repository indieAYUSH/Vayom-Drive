name: Build & Release Vayom Drive (Linux, Windows, Android)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run backend test suite
        run: python -m pytest tests/ -q

  build-desktop:
    needs: backend-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            artifact_name: 'vayom-drive-linux-x86_64'
            args: ''
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            artifact_name: 'vayom-drive-windows-x64'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Configure Telegram credentials mode (BYOK / Embedded)
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ]; then
            echo "Pre-configured Telegram application credentials detected."
          else
            echo "Building with Sovereign BYOK mode (users supply or 1-click extract their own keys in-app)."
          fi

      - name: Build backend standalone sidecar
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          chmod +x scripts/build_sidecar.sh
          ./scripts/build_sidecar.sh

      - name: Verify sidecar binary was produced
        shell: bash
        run: |
          if [ ! -f "src-tauri/binaries/vayom-backend-${{ matrix.target }}" ] && [ ! -f "src-tauri/binaries/vayom-backend-${{ matrix.target }}.exe" ]; then
            echo "::error::Sidecar binary for ${{ matrix.target }} was not produced. The desktop bundle would be incomplete."
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build Tauri Desktop Binary
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  build-android:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Sync web assets into Android project
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets
          cp -r frontend/dist android/app/src/main/assets/web

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vayom-drive-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish-release:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vayom-drive-linux-x86_64
          path: release-assets/linux

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vayom-drive-windows-x64
          path: release-assets/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vayom-drive-android-apk
          path: release-assets/android

      - name: Consolidate Release Assets
        run: |
          mkdir -p dist-release
          find release-assets/ -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.msi" -o -name "*.exe" -o -name "*.apk" \) -exec cp {} dist-release/ \;
          # Also provide clean dot-delimited versions and named APK if spaces/names exist
          cd dist-release
          if [ -f "app-release.apk" ] && [ ! -f "Vayom-Drive-1.0.0.apk" ]; then
            cp app-release.apk Vayom-Drive-1.0.0.apk
          fi
          for f in *\ *; do
            [ -f "$f" ] && cp "$f" "${f// /.}"
          done
          cd ..
          echo "=== Collected Release Binaries ==="
          ls -la dist-release/

      - name: Determine Tag and Release Name
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=Vayom Drive $TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
            echo "title=Vayom Drive v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish All 3 Platforms to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_info.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_info.outputs.title }}
        run: |
          cat << 'EOF' > release_notes.md
          ## 🚀 Vayom Drive — Sovereign Cloud Storage Release

          ### 📦 Download Links for All 3 Platforms:
          - 📱 **Android**: `app-release.apk` (Install directly on any Android device)
          - 🐧 **Linux**: `.AppImage` (portable) and `.deb` (Debian/Ubuntu package)
          - 🪟 **Windows**: `.msi` (installer) and `.exe` (setup executable)

          ### ✨ Key Highlights:
          - **1-Click Sovereign BYOK:** Automated in-app Telegram API key retrieval via `my.telegram.org`.
          - **End-to-End Encrypted Vault:** Client-side AES-256-CTR encryption with local key derivation.
          - **Multi-Part Resilient Streaming:** High-performance video/media streaming with prefetch and range seek support.
          - **Zero Third-Party Cloud Leaks:** All data stored directly in your own private Telegram channel storage node.
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists. Uploading and updating assets..."
            gh release upload "$TAG_NAME" dist-release/* --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" dist-release/* \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md
          fi
