services:
  vayom-drive:
    build:
      context: .
      dockerfile: Dockerfile
    image: vayom-drive:latest
    container_name: vayom-drive
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_DIR=/app/data
      # Telegram API Credentials (optional: can also be configured via in-app UI)
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-}
      # Storage Policies
      - DEFAULT_STORAGE_BACKEND=telegram
      - MAX_PART_BYTES=1900000000
    volumes:
      # Persistent local database, catalog snapshots, thumbnails, and vault storage
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
